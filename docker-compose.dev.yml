# Backing services for local development. The app itself runs on the host
# with `pnpm dev` (see CONTRIBUTING.md).
#
#   docker compose -f docker-compose.dev.yml up -d

name: flowbit-dev

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: flowbit
      POSTGRES_PASSWORD: flowbit
      POSTGRES_DB: flowbit
    ports:
      - '5432:5432'
    volumes:
      - postgres-dev-data:/var/lib/postgresql/data
      - ./docker/dev-init.sql:/docker-entrypoint-initdb.d/dev-init.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U flowbit -d flowbit']
      interval: 5s
      timeout: 5s
      retries: 10

  valkey:
    image: valkey/valkey:8-alpine
    ports:
      - '6379:6379'

volumes:
  postgres-dev-data:
